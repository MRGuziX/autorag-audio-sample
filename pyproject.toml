[project]
name = "autorag-audio-sample"
version = "0.1.0"
description = "An audio corpus sample for the managed OpenShift AI AutoRAG pipelines"
requires-python = ">=3.12,<3.14"
dependencies = [
  "boto3>=1.40,<2",
  "kfp>=2.16.1,<3",
  "PyYAML>=6.0.2,<7",
  "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["ruff>=0.14,<0.15"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
